services:

  icandid_collector_dev:
    image: icandid_collector_dev
    build: 
      context: ./
      dockerfile: Dockerfile
    command: >
      sh -c "cd /app
             tail -f /dev/null"
    networks: 
      - data_network
    env_file:
      - .env_collector
    volumes:
      - ./bin:/app/bin
      - ./config:/app/config
      - ./src:/app/src
      - ../../iCANDID/records:/records
      - ../../iCANDID/records_test:/records_test
      - ../../iCANDID/source_records:/source_records
      - ../../iCANDID/icandid_collector/logs:/app/logs
    depends_on:
      langauge_detector:
        condition: service_started


  icandid_collector:
    build: 
      context: ./
      dockerfile: Dockerfile    
    networks:
      - data_network
    volumes:
      - ./config:/app/config
      - ../../iCANDID/records:/records
      - ../../iCANDID/source_records:/source_records
      - ../../iCANDID/icandid_collector/logs:/app/logs


  langauge_detector:
    image: registry.docker.libis.be/libis/language-detector:beta
    environment:
      - OH_VERSION=BETA
    ports:
      - "4568:4567"


networks:
  data_network:
    driver: bridge
